name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Write .env
        run: echo "${{ secrets.ENV_PROD }}" > .env

      - name: Build and deploy
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Run migrations
        run: docker compose -f docker-compose.prod.yml exec -T atps-api alembic upgrade head

      - name: Smoke test
        run: |
          sleep 8
          curl -fsS http://localhost:8512/api/health
