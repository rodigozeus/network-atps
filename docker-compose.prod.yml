x-logging: &logging
  # Rotação dos logs dos containers (antes cresciam sem limite).
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  atps-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env
    networks:
      - internal
      - db-network
    logging: *logging
    restart: unless-stopped

  # Tarefas diárias: reverificação do vínculo no Portal da Transparência, exclusão
  # de contas com prazo de contestação vencido e aviso de novos termos (tarefas.py).
  atps-tarefas:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "tarefas.py", "--loop"]
    volumes:
      - uploads:/app/uploads
    env_file:
      - .env
    networks:
      - db-network
    logging: *logging
    restart: unless-stopped

  atps-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8512:80"
    networks:
      - internal
    depends_on:
      - atps-api
    logging: *logging
    restart: unless-stopped

networks:
  internal:
  db-network:
    external: true

volumes:
  uploads:
